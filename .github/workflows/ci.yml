# Builds mj on every push and pull request. A push to main whose version()
# has no release yet also tags v<version> and publishes a GitHub release with
# the binaries and their checksums, which install.sh downloads. So releasing
# is merging a PR that bumps version() in src/main.bend.
#
# Bend emits one portable C file, which each platform then compiles with
# clang, so Bend is only installed once.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Bend's update check writes ~/.bend; skip it.
  BEND_NO_TELEMETRY: "1"

jobs:
  emit:
    name: check and emit C
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Bend version pinned in mise.toml.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bend src/main.bend --check-only
      # `--` hands --version to mj rather than to bend.
      - name: Read the version
        id: version
        run: |
          v=$(bend src/main.bend -- --version)
          echo "version=${v#mj }" >> "$GITHUB_OUTPUT"
      - run: bend src/main.bend -o mj.c
      - run: shellcheck install.sh
      - name: Check install.sh downloads from this repo
        run: |
          grep -qx "REPO=\"$GITHUB_REPOSITORY\"" install.sh || {
            echo "::error file=install.sh::set REPO=\"$GITHUB_REPOSITORY\" in install.sh"
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mj.c
          path: mj.c
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: emit
    strategy:
      fail-fast: false
      matrix:
        include:
          # -static: the binary then runs on any distro, whatever its libc.
          - { target: linux-x64, runner: ubuntu-24.04, cflags: -static }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, cflags: -static }
          - { target: darwin-x64, runner: macos-15-intel, cflags: "" }
          - { target: darwin-arm64, runner: macos-15, cflags: "" }
    runs-on: ${{ matrix.runner }}
    env:
      CFLAGS: ${{ matrix.cflags }}
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mj.c
      # The flags `bend -o` passes to clang, plus CFLAGS.
      - name: Compile
        run: |
          # shellcheck disable=SC2086 # CFLAGS is empty or one flag
          clang -std=c11 -O3 $CFLAGS mj.c -lpthread -lm -o mj
          strip mj
      - name: Smoke test
        run: |
          ./mj -h >/dev/null
          ./mj -v
          status=0; ./mj bogus 2>/dev/null || status=$?
          test "$status" -eq 2
          # `mj new` opens the editor on /dev/tty, so give it one with script.
          export XDG_DATA_HOME="$RUNNER_TEMP/data" EDITOR=true
          if [ "$RUNNER_OS" = Linux ]; then
            script -qec "./mj new" /dev/null
          else
            script -q /dev/null ./mj new
          fi
          head -n 1 "$XDG_DATA_HOME"/my-journal/entries/*.md | grep '^# '
      - name: Package
        run: tar -czf "mj-$TARGET.tar.gz" mj
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mj-${{ matrix.target }}
          path: mj-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [emit, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.emit.outputs.version }}
    steps:
      - name: Check whether this version is released
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released; bump version() to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.new == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mj-*
          path: dist
          merge-multiple: true
      - name: Checksums
        if: steps.check.outputs.new == 'true'
        working-directory: dist
        run: sha256sum mj-*.tar.gz > checksums.txt
      # Creates the tag on this commit too.
      - name: Publish
        if: steps.check.outputs.new == 'true'
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes dist/*
