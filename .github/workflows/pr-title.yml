# Comments on each PR with the release merging it would make, and checks that
# its title is a Conventional Commit. A squash merge makes the title and
# description the commit on main; a merge or rebase brings the PR's own
# commits; the comment covers both (see .github/scripts/release-preview.mjs). If the title isn't
# conventional, the comment explains the types and the check fails. The check
# isn't required, so such a PR can still merge.
name: pr title

on:
  # _target so the comment can be posted on PRs from forks too. Safe here: no
  # code from the PR is checked out or run.
  pull_request_target:
    # Only merges to main release anything.
    branches: [main]
    # synchronize: new commits change what a merge or rebase releases.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: conventional title
    # Edits to anything else, such as the base branch, change nothing here.
    if: github.event.action != 'edited' || github.event.changes.title || github.event.changes.body
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint
        # The comment is written either way; the last step fails the job.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # main's code, not the PR's: pull_request_target checks out the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags, for the last release.
          fetch-depth: 0
          persist-credentials: false
      - name: Preview the release
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          TITLE_OK: ${{ steps.lint.outcome == 'success' }}
          COMMITS: ${{ runner.temp }}/commits.jsonl
          COMMENT: ${{ runner.temp }}/comment.md
          # release.yml's semantic-release-action and the versions it's given
          # there. CI fails if they differ from release.yml's.
          ACTION: cycjimmy/semantic-release-action/b12c8f6015dc215fe37bc154d4ad456dd3833c90
          SEMANTIC_RELEASE: 25.0.9
          PRESET: conventional-changelog-conventionalcommits@10.4.1
        run: |
          # Installs semantic-release the way the action does, from the
          # action's lockfile, so the commit analyzer is the release's.
          # --ignore-scripts: this job can write to PRs, so no package gets to
          # run code on install.
          for f in package.json package-lock.json; do
            curl -fsSL -o "$f" "https://raw.githubusercontent.com/$ACTION/$f"
          done
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm install --ignore-scripts --no-audit --no-fund \
            "semantic-release@$SEMANTIC_RELEASE" "$PRESET" yaml@2.9.1
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[].commit.message | @json' > "$COMMITS"
          node .github/scripts/release-preview.mjs
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title
          path: ${{ runner.temp }}/comment.md
      - name: Fail if the title isn't conventional
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::error::The PR title isn't a Conventional Commit; the comment on the PR explains the types."
          exit 1
