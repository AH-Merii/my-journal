# Checks that a PR's title is a Conventional Commit. A squash merge makes the
# title the commit on main, and that commit sets the next version (see
# .releaserc.yaml). If the title isn't conventional, this fails and leaves a
# comment explaining the types; fixing the title removes the comment. The
# check isn't required, so such a PR can still merge, but it then releases
# nothing.
name: pr title

on:
  # _target so the comment can be posted on PRs from forks too. Safe here: no
  # code from the PR is checked out or run.
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # always(): the step above fails the job when the title is wrong.
      - if: always() && steps.lint.outputs.error_message != null
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title
          message: |
            This PR's title isn't a [Conventional Commit](https://www.conventionalcommits.org). When squash-merged, the title becomes the commit on `main` that decides the next version, so please rename it to `<type>(<scope>): <summary>`, e.g. `fix(install): accept MJ_VERSION without a leading v`. Left as it is, merging releases nothing, even if it changes mj.

            - `feat`: something new for users (minor)
            - `fix`: a bug fix (patch)
            - `perf`: faster or lighter, same behaviour (patch)
            - `refactor`: restructured code, same behaviour (no release)
            - `docs`: documentation only (no release)
            - `test`: tests only (no release)
            - `build`: build setup or dependencies, e.g. `mise.toml` (no release)
            - `ci`: workflows and CI scripts (no release)
            - `chore`: other upkeep (no release)
            - `style`: formatting only (no release)
            - `revert`: undoes an earlier change (no release)
            - add `!` after the type, e.g. `feat!:`, when users must change how they use mj (major)

            <details><summary>Check output</summary>

            ```
            ${{ steps.lint.outputs.error_message }}
            ```

            </details>
      - if: steps.lint.outputs.error_message == null
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title
          delete: true
