# On each merge to main, builds mj at the version its commits call for and,
# unless no commit asks for a bump, tags v<version> on that commit and
# publishes a GitHub release with the binaries and their checksums, which
# install.sh downloads.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, so two quick merges can't both claim a version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: publish release
    needs: build
    if: needs.build.outputs.bump != 'none'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mj-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum mj-*.tar.gz > checksums.txt
      # Creates the tag on this commit too.
      - name: Publish
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes dist/*
